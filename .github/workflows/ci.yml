name: Build, test & release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-26
            target: macos-arm64
          - runner: macos-26-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Apple toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcrun swift --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - name: Validate and build both clients
        env:
          VIBECHAR_SIGN_IDENTITY: '-'
        run: bash scripts/check.sh
      - name: Sign and notarize trusted main builds
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_P12" ]]; then
            bash scripts/ci-signing.sh
          else
            echo 'Signing secrets not configured: Mac artifact is a preview; no stable release will be published.'
          fi
      - name: Portable static Linux binaries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p vibechar -p vc
          target/x86_64-unknown-linux-musl/release/vc --version
          target/x86_64-unknown-linux-musl/release/vibechar --syntax-count
          VIBECHAR_TEST_VC="$PWD/target/x86_64-unknown-linux-musl/release/vc" python3 scripts/test-launcher.py
      - name: Package
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then export VIBECHAR_BIN_DIR="$PWD/target/x86_64-unknown-linux-musl/release"; fi
          bash scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vibechar-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vibechar-*
          merge-multiple: true
          path: dist/release
      - name: Publish immutable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
