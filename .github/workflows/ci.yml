name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/versioning.py current
          if [[ -n "$BASE" ]]; then python3 scripts/versioning.py lint --base "$BASE" --head "$HEAD"; fi
  build:
    needs: conventions
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ github.sha }}
