[workspace]
members = ["crates/core", "crates/bridge", "crates/terminal", "crates/launcher"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rovnyart/vibechar"

[workspace.dependencies]
ropey = "=1.6.1"
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.0"
unicode-bidi = "=0.3.18"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["use-dev-tty"] }
libc = "=0.2.191"
regex = "=1.13.1"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
